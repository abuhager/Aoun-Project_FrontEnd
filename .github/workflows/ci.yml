name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      NEXT_PUBLIC_API_URL: https://api.aoun.invalid
      BACKEND_URL: https://api.aoun.invalid
      SERVER_API_TIMEOUT_MS: "1000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint, typecheck, and tests
        run: npm run verify

      - name: Build production application
        run: npm run build
