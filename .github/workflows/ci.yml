name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: "true"
      NEXT_PUBLIC_API_URL: https://api.aoun.invalid
      BACKEND_URL: https://api.aoun.invalid
      SERVER_API_TIMEOUT_MS: "1000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint, typecheck, and tests
        run: npm run verify

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > sbom.cdx.json

      - name: Build production application
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run non-mutating critical E2E tests
        run: npm run e2e:ci

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-verification-${{ github.run_id }}
          path: |
            sbom.cdx.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
